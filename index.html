<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="150">
  <meta name="theme-color" content="#f5f5f7">

  <title>150</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f5f5f7;
      color: #1d1d1f;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Arial,
        sans-serif;
    }

    .app {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      padding:
        calc(30px + env(safe-area-inset-top))
        20px
        calc(40px + env(safe-area-inset-bottom));
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      margin: 0 0 6px;
      font-size: 34px;
    }

    .header p {
      margin: 0;
      color: #6e6e73;
      font-size: 15px;
    }

    .card {
      margin-bottom: 18px;
      padding: 26px 22px;
      background: white;
      border-radius: 24px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
    }

    .today {
      margin-bottom: 22px;
      text-align: center;
      font-size: 23px;
      font-weight: 700;
    }

    .main-number {
      margin-bottom: 7px;
      text-align: center;
      font-size: 30px;
      font-weight: 750;
    }

    .completion {
      color: #31a354;
      text-align: center;
      font-size: 18px;
      font-weight: 650;
    }

    .remaining {
      margin: 24px 0 5px;
      color: #6e6e73;
      text-align: center;
      font-size: 17px;
    }

    .days-left {
      margin: 0 0 24px;
      color: #6e6e73;
      text-align: center;
      font-size: 15px;
      font-weight: 600;
    }

    .pace-section {
      padding-top: 20px;
      border-top: 1px solid #eeeeef;
    }

    .pace-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin: 9px 0;
      font-size: 16px;
    }

    .pace-value {
      text-align: right;
      font-weight: 650;
    }

    .ahead {
      color: #31a354;
    }

    .behind {
      color: #d35454;
    }

    .on-target {
      color: #31a354;
    }

    .week-label {
      margin-top: 20px;
      color: #8e8e93;
      text-align: center;
      font-size: 13px;
    }

    h2 {
      margin: 0 0 14px;
      font-size: 20px;
    }

    .daily-list {
      margin-top: 4px;
    }

    .daily-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 13px 0;
      border-bottom: 1px solid #eeeeef;
      font-size: 16px;
    }

    .daily-row:last-child {
      border-bottom: none;
    }

    .daily-day {
      color: #1d1d1f;
    }

    .daily-minutes {
      font-weight: 650;
      text-align: right;
    }

    .daily-today {
      color: #31a354;
      font-weight: 650;
    }

    .history-row {
      padding: 15px 0;
      border-bottom: 1px solid #eeeeef;
    }

    .history-row:last-child {
      border-bottom: none;
    }

    .history-week {
      margin-bottom: 5px;
      color: #6e6e73;
      font-size: 14px;
    }

    .history-main {
      font-size: 17px;
      font-weight: 650;
    }

    .history-percent {
      margin-top: 3px;
      color: #6e6e73;
      font-size: 14px;
    }

    .empty {
      padding: 20px 0;
      color: #8e8e93;
      text-align: center;
      font-size: 14px;
    }

    .backup-buttons {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    button,
    .restore-label {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: #efeff4;
      color: #1d1d1f;
      text-align: center;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    #restoreFile {
      display: none;
    }

    .saved-note {
      margin-top: 16px;
      color: #8e8e93;
      text-align: center;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <main class="app">

    <div class="header">
      <h1>150</h1>
      <p>Weekly Exercise Minutes</p>
    </div>

    <section class="card">

      <div class="today" id="today"></div>

      <div class="main-number">
        <span id="minutes">0</span> / 150 minutes
      </div>

      <div class="completion">
        Week completion:
        <span id="percent">0%</span>
      </div>

      <div class="remaining" id="remaining">
        150 minutes remaining
      </div>

      <div class="days-left" id="daysLeft">
        6 days left
      </div>

      <div class="pace-section">

        <div class="pace-row">
          <span>Today's target:</span>
          <span class="pace-value" id="target">
            0 min
          </span>
        </div>

        <div class="pace-row">
          <span>Current pace:</span>
          <span class="pace-value" id="pace"></span>
        </div>

      </div>

      <div class="week-label" id="weekLabel"></div>

    </section>

    <section class="card">

      <h2>This Week</h2>

      <div class="daily-list" id="dailyList"></div>

    </section>

    <section class="card">

      <h2>Weekly History</h2>

      <div id="history"></div>

      <div class="backup-buttons">

        <button type="button" onclick="downloadBackup()">
          Backup History
        </button>

        <label class="restore-label">
          Restore History

          <input
            id="restoreFile"
            type="file"
            accept=".json,application/json"
            onchange="restoreBackup(event)"
          >
        </label>

      </div>

      <div class="saved-note">
        Backup history at the end of each month.
      </div>

    </section>

  </main>

  <script>
    const GOAL = 150;

    const DAY_NAMES = [
      "Monday",
      "Tuesday",
      "Wednesday",
      "Thursday",
      "Friday",
      "Saturday",
      "Sunday"
    ];

    const DAY_PARAMETERS = [
      "mon",
      "tue",
      "wed",
      "thu",
      "fri",
      "sat",
      "sun"
    ];

    function mondayOf(date = new Date()) {
      const d = new Date(date);
      const day = d.getDay();
      const difference = day === 0 ? -6 : 1 - day;

      d.setDate(d.getDate() + difference);
      d.setHours(0, 0, 0, 0);

      return d;
    }

    function sundayOf(monday) {
      const d = new Date(monday);

      d.setDate(d.getDate() + 6);

      return d;
    }

    function dateID(date) {
      return (
        date.getFullYear() +
        "-" +
        String(date.getMonth() + 1).padStart(2, "0") +
        "-" +
        String(date.getDate()).padStart(2, "0")
      );
    }

    function formatDate(date) {
      return date.toLocaleDateString("en-US", {
        month: "short",
        day: "numeric"
      });
    }

    function getData() {
      try {
        const saved =
          JSON.parse(localStorage.getItem("150Data"));

        if (
          saved &&
          saved.weeks &&
          typeof saved.weeks === "object"
        ) {
          return saved;
        }

        return {
          weeks: {}
        };

      } catch {
        return {
          weeks: {}
        };
      }
    }

    function saveData(data) {
      localStorage.setItem(
        "150Data",
        JSON.stringify(data)
      );
    }

    function cleanNumber(value) {
      const number = Number(value);

      if (!Number.isFinite(number) || number < 0) {
        return null;
      }

      return Math.round(number);
    }

    function getIncomingUpdate() {
      const params =
        new URLSearchParams(window.location.search);

      const dailyMinutes = [];
      let hasDailyValues = false;

      DAY_PARAMETERS.forEach(parameter => {
        if (params.has(parameter)) {
          hasDailyValues = true;

          const value =
            cleanNumber(params.get(parameter));

          dailyMinutes.push(
            value === null ? 0 : value
          );
        } else {
          dailyMinutes.push(0);
        }
      });

      let weeklyMinutes = null;

      if (params.has("minutes")) {
        weeklyMinutes =
          cleanNumber(params.get("minutes"));
      }

      /*
        The seven daily totals are the most
        reliable source when they are present.
        Add them together to calculate the
        weekly total automatically.
      */

      if (hasDailyValues) {
        weeklyMinutes =
          dailyMinutes.reduce(
            (total, value) => total + value,
            0
          );
      }

      if (
        weeklyMinutes === null &&
        !hasDailyValues
      ) {
        return null;
      }

      return {
        minutes: weeklyMinutes || 0,
        dailyMinutes: dailyMinutes
      };
    }

    function saveCurrentWeek(update) {
      const data = getData();

      const monday = mondayOf();
      const id = dateID(monday);

      const existing =
        data.weeks[id] || {
          start: id,
          minutes: 0,
          dailyMinutes: [0, 0, 0, 0, 0, 0, 0]
        };

      existing.start = id;
      existing.minutes = update.minutes;

      if (
        Array.isArray(update.dailyMinutes) &&
        update.dailyMinutes.length === 7
      ) {
        existing.dailyMinutes =
          update.dailyMinutes;
      }

      data.weeks[id] = existing;

      saveData(data);
    }

    function currentWeekData() {
      const data = getData();
      const id = dateID(mondayOf());

      const week =
        data.weeks[id];

      if (!week) {
        return {
          start: id,
          minutes: 0,
          dailyMinutes: [0, 0, 0, 0, 0, 0, 0]
        };
      }

      return {
        start: week.start || id,
        minutes:
          cleanNumber(week.minutes) || 0,
        dailyMinutes:
          Array.isArray(week.dailyMinutes) &&
          week.dailyMinutes.length === 7
            ? week.dailyMinutes.map(value =>
                cleanNumber(value) || 0
              )
            : [0, 0, 0, 0, 0, 0, 0]
      };
    }

    function renderCurrent() {
      const now = new Date();

      const weekday =
        now.toLocaleDateString("en-US", {
          weekday: "long"
        });

      document.getElementById("today").textContent =
        weekday;

      const week =
        currentWeekData();

      const minutes =
        week.minutes;

      const percent =
        Math.round((minutes / GOAL) * 100);

      const remaining =
        Math.max(0, GOAL - minutes);

      const jsDay =
        now.getDay();

      const dayNumber =
        jsDay === 0 ? 7 : jsDay;

      const daysLeft =
        7 - dayNumber;

      const target =
        Math.round((GOAL * dayNumber) / 7);

      const pace =
        minutes - target;

      document.getElementById("minutes").textContent =
        minutes;

      document.getElementById("percent").textContent =
        percent + "%";

      const remainingElement =
        document.getElementById("remaining");

      if (remaining > 0) {
        remainingElement.textContent =
          remaining +
          (remaining === 1
            ? " minute remaining"
            : " minutes remaining");
      } else {
        remainingElement.textContent =
          "150 minute goal reached";
      }

      const daysLeftElement =
        document.getElementById("daysLeft");

      if (daysLeft === 0) {
        daysLeftElement.textContent =
          "Last day";
      } else if (daysLeft === 1) {
        daysLeftElement.textContent =
          "1 day left";
      } else {
        daysLeftElement.textContent =
          daysLeft + " days left";
      }

      document.getElementById("target").textContent =
        target + " min";

      const paceElement =
        document.getElementById("pace");

      if (pace > 0) {
        paceElement.textContent =
          pace + " min ahead";

        paceElement.className =
          "pace-value ahead";

      } else if (pace < 0) {
        paceElement.textContent =
          Math.abs(pace) + " min behind";

        paceElement.className =
          "pace-value behind";

      } else {
        paceElement.textContent =
          "On target";

        paceElement.className =
          "pace-value on-target";
      }

      const monday =
        mondayOf();

      const sunday =
        sundayOf(monday);

      document.getElementById("weekLabel").textContent =
        formatDate(monday) +
        " – " +
        formatDate(sunday);
    }

    function renderDailyMinutes() {
      const week =
        currentWeekData();

      const now =
        new Date();

      const jsDay =
        now.getDay();

      const todayIndex =
        jsDay === 0 ? 6 : jsDay - 1;

      const container =
        document.getElementById("dailyList");

      container.innerHTML =
        DAY_NAMES.map((day, index) => {
          const minutes =
            week.dailyMinutes[index] || 0;

          const dayClass =
            index === todayIndex
              ? "daily-day daily-today"
              : "daily-day";

          return `
            <div class="daily-row">
              <span class="${dayClass}">
                ${day}
              </span>

              <span class="daily-minutes">
                ${minutes} min
              </span>
            </div>
          `;
        }).join("");
    }

    function renderHistory() {
      const data = getData();

      const currentID =
        dateID(mondayOf());

      const weeks =
        Object.values(data.weeks)
          .filter(item =>
            item.start !== currentID
          )
          .sort((a, b) =>
            b.start.localeCompare(a.start)
          );

      const container =
        document.getElementById("history");

      if (weeks.length === 0) {
        container.innerHTML =
          '<div class="empty">' +
          'Completed weeks will appear here.' +
          '</div>';

        return;
      }

      container.innerHTML =
        weeks.map(item => {
          const start =
            new Date(
              item.start + "T00:00:00"
            );

          const end =
            sundayOf(start);

          const minutes =
            cleanNumber(item.minutes) || 0;

          const percent =
            Math.round(
              (minutes / GOAL) * 100
            );

          return `
            <div class="history-row">

              <div class="history-week">
                ${formatDate(start)} – ${formatDate(end)}
              </div>

              <div class="history-main">
                ${minutes} / 150 minutes
              </div>

              <div class="history-percent">
                Week completion: ${percent}%
              </div>

            </div>
          `;
        }).join("");
    }

    function downloadBackup() {
      const data =
        getData();

      const backup = {
        app: "150",
        version: 2,
        created: new Date().toISOString(),
        data: data
      };

      const blob =
        new Blob(
          [JSON.stringify(backup, null, 2)],
          {
            type: "application/json"
          }
        );

      const url =
        URL.createObjectURL(blob);

      const link =
        document.createElement("a");

      const today =
        new Date()
          .toISOString()
          .slice(0, 10);

      link.href =
        url;

      link.download =
        "150-backup-" +
        today +
        ".json";

      document.body.appendChild(link);

      link.click();

      document.body.removeChild(link);

      setTimeout(() => {
        URL.revokeObjectURL(url);
      }, 1000);
    }

    function restoreBackup(event) {
      const file =
        event.target.files[0];

      if (!file) {
        return;
      }

      const reader =
        new FileReader();

      reader.onload = function () {
        try {
          const backup =
            JSON.parse(reader.result);

          if (
            !backup ||
            backup.app !== "150" ||
            !backup.data ||
            !backup.data.weeks
          ) {
            throw new Error();
          }

          saveData(backup.data);

          renderCurrent();
          renderDailyMinutes();
          renderHistory();

          alert("150 history restored.");

        } catch {
          alert(
            "This does not appear to be a valid 150 backup."
          );
        }

        event.target.value = "";
      };

      reader.readAsText(file);
    }

    const incomingUpdate =
      getIncomingUpdate();

    if (incomingUpdate !== null) {
      saveCurrentWeek(incomingUpdate);

      if (window.history.replaceState) {
        window.history.replaceState(
          {},
          document.title,
          window.location.pathname
        );
      }
    }

    renderCurrent();
    renderDailyMinutes();
    renderHistory();
  </script>

</body>
</html>
