<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="150">
  <meta name="theme-color" content="#ffffff">

  <title>150</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f5f7;
      color: #1d1d1f;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
        "SF Pro Text", Arial, sans-serif;
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      padding:
        calc(30px + env(safe-area-inset-top))
        20px
        calc(40px + env(safe-area-inset-bottom));
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 34px;
      margin: 0 0 6px;
      font-weight: 750;
    }

    .header p {
      margin: 0;
      color: #6e6e73;
      font-size: 15px;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 28px 20px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
      margin-bottom: 18px;
    }

    .week-label {
      text-align: center;
      color: #6e6e73;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .progress {
      text-align: center;
    }

    .progress-main {
      font-size: 34px;
      font-weight: 750;
      letter-spacing: -1px;
      margin-bottom: 8px;
    }

    .percent {
      font-size: 28px;
      font-weight: 700;
      color: #31a354;
      margin-bottom: 16px;
    }

    .remaining {
      color: #6e6e73;
      font-size: 16px;
    }

    .complete {
      color: #31a354;
      font-weight: 600;
    }

    h2 {
      font-size: 20px;
      margin: 0 0 16px;
    }

    .history-empty {
      color: #8e8e93;
      text-align: center;
      font-size: 15px;
      padding: 18px 0;
    }

    .history-row {
      padding: 14px 0;
      border-bottom: 1px solid #eeeeef;
    }

    .history-row:last-child {
      border-bottom: none;
    }

    .history-week {
      color: #6e6e73;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .history-result {
      font-size: 17px;
      font-weight: 600;
    }

    .sync-note {
      text-align: center;
      color: #8e8e93;
      font-size: 12px;
      line-height: 1.4;
      padding: 2px 14px;
    }
  </style>
</head>

<body>

  <main class="app">

    <div class="header">
      <h1>150</h1>
      <p>Weekly Exercise Minutes</p>
    </div>

    <section class="card">

      <div class="week-label" id="weekLabel"></div>

      <div class="progress">

        <div class="progress-main">
          <span id="currentMinutes">0</span> / 150 minutes
        </div>

        <div class="percent" id="percentage">
          = 0%
        </div>

        <div class="remaining" id="remaining">
          150 minutes remaining
        </div>

      </div>

    </section>

    <section class="card">

      <h2>Weekly History</h2>

      <div id="history"></div>

    </section>

    <div class="sync-note">
      Exercise Minutes will come from Apple Health.
    </div>

  </main>


  <script>

    const WEEKLY_GOAL = 150;

    /*
      Later, our iPhone Shortcut will update this value
      using your Apple Health Exercise Minutes.
    */

    let currentMinutes = 0;


    // -------------------------
    // DATE HELPERS
    // -------------------------

    function startOfWeek(date = new Date()) {

      const d = new Date(date);

      const day = d.getDay();

      const difference = day === 0 ? -6 : 1 - day;

      d.setDate(d.getDate() + difference);

      d.setHours(0, 0, 0, 0);

      return d;
    }


    function endOfWeek(start) {

      const end = new Date(start);

      end.setDate(start.getDate() + 6);

      return end;
    }


    function formatDate(date) {

      return date.toLocaleDateString("en-US", {
        month: "short",
        day: "numeric"
      });

    }


    function weekID(date) {

      const start = startOfWeek(date);

      return start.getFullYear() + "-" +
        String(start.getMonth() + 1).padStart(2, "0") + "-" +
        String(start.getDate()).padStart(2, "0");
    }


    // -------------------------
    // WEEKLY HISTORY
    // -------------------------

    function getHistory() {

      try {

        return JSON.parse(
          localStorage.getItem("150WeeklyHistory")
        ) || [];

      } catch {

        return [];

      }

    }


    function saveHistory(history) {

      localStorage.setItem(
        "150WeeklyHistory",
        JSON.stringify(history)
      );

    }


    function checkForNewWeek() {

      const thisWeek = weekID(new Date());

      const savedWeek =
        localStorage.getItem("150CurrentWeek");

      const savedMinutes =
        Number(
          localStorage.getItem("150CurrentMinutes")
        ) || 0;


      if (!savedWeek) {

        localStorage.setItem(
          "150CurrentWeek",
          thisWeek
        );

        currentMinutes = savedMinutes;

        return;
      }


      if (savedWeek !== thisWeek) {

        const history = getHistory();

        const oldStart =
          new Date(savedWeek + "T00:00:00");

        const oldEnd =
          endOfWeek(oldStart);

        const oldPercent =
          Math.round(
            (savedMinutes / WEEKLY_GOAL) * 100
          );


        history.unshift({

          week:
            formatDate(oldStart) +
            " – " +
            formatDate(oldEnd),

          minutes: savedMinutes,

          percent: oldPercent

        });


        saveHistory(history);


        localStorage.setItem(
          "150CurrentWeek",
          thisWeek
        );

        localStorage.setItem(
          "150CurrentMinutes",
          "0"
        );

        currentMinutes = 0;

      }

      else {

        currentMinutes = savedMinutes;

      }

    }


    // -------------------------
    // DISPLAY
    // -------------------------

    function updateDisplay() {

      const start = startOfWeek();

      const end = endOfWeek(start);


      document.getElementById(
        "weekLabel"
      ).textContent =
        formatDate(start) +
        " – " +
        formatDate(end);


      const percent =
        Math.round(
          (currentMinutes / WEEKLY_GOAL) * 100
        );


      document.getElementById(
        "currentMinutes"
      ).textContent =
        currentMinutes;


      document.getElementById(
        "percentage"
      ).textContent =
        "= " + percent + "%";


      const remaining =
        WEEKLY_GOAL - currentMinutes;


      const remainingElement =
        document.getElementById("remaining");


      if (remaining > 0) {

        remainingElement.textContent =
          remaining +
          (remaining === 1
            ? " minute remaining"
            : " minutes remaining");

        remainingElement.className =
          "remaining";

      }

      else {

        remainingElement.textContent =
          "150 minute goal reached";

        remainingElement.className =
          "remaining complete";

      }


      renderHistory();

    }


    function renderHistory() {

      const history = getHistory();

      const container =
        document.getElementById("history");


      if (history.length === 0) {

        container.innerHTML =
          '<div class="history-empty">' +
          'Your completed weeks will appear here.' +
          '</div>';

        return;

      }


      container.innerHTML =
        history.map(item => {

          return `
            <div class="history-row">

              <div class="history-week">
                ${item.week}
              </div>

              <div class="history-result">
                ${item.minutes} / 150 minutes = ${item.percent}%
              </div>

            </div>
          `;

        }).join("");

    }


    // -------------------------
    // START APP
    // -------------------------

    checkForNewWeek();

    updateDisplay();

  </script>

</body>
</html>
